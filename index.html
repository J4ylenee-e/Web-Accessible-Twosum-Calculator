<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TwoSum</title>
    <link rel="stylesheet" href="style.css">
    <script src="./script.js" defer>

    </script>

</head>
<body>
    <h1>Two Sum</h1>
    <p>Enter any number into the array!</p>
    <input type="number" id="numberInput" placeholder="Enter number: ">
    <button id="push">Push!</button>
    <button id="pop">Pop!</button>

    <h2>Array</h2>
    <div id="array">

    </div>

    <h2>Target</h2>
    <input type="number" id="targetInput" placeholder="Enter Target number: ">
    <button id="targetnum">Go!</button>

    <h2>Two sum result</h2>
    <div id="result">
    </div>


</body>

</html>
